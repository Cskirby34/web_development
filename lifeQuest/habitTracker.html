<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link href="css/background.css" type="text/css" rel="stylesheet">
    <link href="css/styles.css" type="text/css" rel="stylesheet">
    <script src="js/nav.js"></script>
  </head>
  <body>
    <header>
      <h1>Healthy Habit Tracker</h1>
    </header>
    <nav>
      <button class="hamburger" onclick="toggleMenu()">☰</button>
      <b id="nav-links">
        <a href="index.html">Home</a>
        <a href="moneymanager.html">Money Manager</a>
        <a href="habitTracker.html">Healthy Habits</a>
        <a href="productivity.html">Productivity</a>
        <a href="achievement.html">Achievements</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="quizGames.html">Quiz Game</a>
      </b>
      <a href="login.html" class="login-btn">Login</a>
    </nav>
    <main>
      <section>
        <h2>Today's log</h2>
        <ul>
          <li>Meals:<span id="counter3">0</span>
            <button onclick="add3()">+</button>
            <button onclick="sub3()">-</button>
          </li>
          <li>
            Water: <span id="counter">0</span> glasses
            <button onclick="add()">+</button>
            <button onclick="sub()">-</button>
          </li>
          <li>Sleep: <span id="counter2"> 0</span>hours
          <button onclick="add2()">+</button>
          <button onclick="sub2()">-</button>
          </li>
          <li>Below is a timer you can use for how long you exercise for</li>
          <li>Exercise: <span id="timer">0</span> seconds</li>
        </ul>
        <button onclick="myStartFunction()">Start!</button>
        <button onclick="myStopFunction()">Stop!</button>
        <button onclick="myResetFunction()">Reset!</button>
      </section>
    </main>
    <footer>
      <p>&#169; 2026 LifeQuest</p>
    </footer>
    <script>
      let count = 0;
      let count2 = 0;
      let count3 = 0;

        

      function add() {
        count++;
        document.getElementById("counter").innerHTML = count;
      }

      function sub() {
        if (count > 0) count--; 
        document.getElementById("counter").innerHTML = count;
      }
      function add2() {
        count2++;
        document.getElementById("counter2").innerHTML = count2;
      }

      function sub2() {
        if (count2 > 0) count2--; 
        document.getElementById("counter2").innerHTML = count2;
      }

      function add3() {
        count3++;
        document.getElementById("counter3").innerHTML = count3;
      }

      function sub3() {
        if (count3 > 0) count3--; 
        document.getElementById("counter3").innerHTML = count3;
      }

      let seconds = 0;
      let intervalId = null;

      function myStartFunction() {
        if (intervalId !== null) return;
        intervalId = setInterval(function() {
          seconds++;
          document.getElementById("timer").innerHTML = seconds;
        }, 1000);
      }

      function myStopFunction() {
        clearInterval(intervalId);
        intervalId = null;
      }

      function myResetFunction() {
        clearInterval(intervalId);
        intervalId = null;
        seconds = 0;
        document.getElementById("timer").innerHTML = seconds;
      }

      function toggleMenu() {
        document.getElementById('nav-links').classList.toggle('open');
      }
      document.addEventListener('click', function(e) {
        const nav = document.querySelector('nav');
        if (!nav.contains(e.target)) {
          document.getElementById('nav-links').classList.remove('open');
        }
      });
    </script>
  </body>
</html>

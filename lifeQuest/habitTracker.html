<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link href="css/background.css" type="text/css" rel="stylesheet">
    <link href="css/styles.css" type="text/css" rel="stylesheet">
    <script src="js/nav.js"></script>
  </head>
  <body>
    <header>
      <h1>Healthy Habit Tracker</h1>
    </header>
    <nav>
      <button class="hamburger" onclick="toggleMenu()">☰</button>
      <b id="nav-links">
        <a href="index.html">Home</a>
        <a href="moneymanager.html">Money Manager</a>
        <a href="habitTracker.html">Healthy Habits</a>
        <a href="productivity.html">Productivity</a>
        <a href="achievement.html">Achievements</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="quizGames.html">Quiz Game</a>
      </b>
      <a href="login.html" class="login-btn">Login</a>
    </nav>
    <main>
      <section>
        <h2>Today's log</h2>
        <ul>
          <li>Meals: 3</li>
          <li>Water: 6 glasses</li>
          <li>Sleep: 7 hours</li>
git          <li>Below is a timer you can use for how long you exercise for</li>
          <div>
            <li>Exercise: <span id="timer">0</span> seconds</li>

          </div>

          
        </ul>
        <button onclick="myStartFunction()">Start!</button>
        <button onclick="myStopFunction()">Stop!</button>
        <button onclick="myResetFunction()">Reset!</button>
      </section>
    </main>
    <footer>
      <p>&#169; 2026 LifeQuest</p>
    </footer>
    <script>
      let seconds = 0;
      let intervalId = null;

      function myStartFunction() {
        // Prevent multiple intervals from running at once
        if (intervalId !== null) return;
        intervalId = setInterval(function() {
          seconds++;
          document.getElementById("timer").innerHTML = seconds;
        }, 1000);
      }

      function myStopFunction() {
        clearInterval(intervalId);
        intervalId = null;
      }

      function myResetFunction() {
        clearInterval(intervalId);
        intervalId = null;
        seconds = 0;
        document.getElementById("timer").innerHTML = seconds;
      }
      function toggleMenu() {
        document.getElementById('nav-links').classList.toggle('open');
      }
      document.addEventListener('click', function(e) {
        const nav = document.querySelector('nav');
        if (!nav.contains(e.target)) {
          document.getElementById('nav-links').classList.remove('open');
        }
      });
    </script>
  </body>
</html>

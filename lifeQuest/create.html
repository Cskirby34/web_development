<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>Create Account</title>
   <link href="../css/background.css" type="text/css" rel="stylesheet">
   <link href="../css/create.css" type="text/css" rel="stylesheet">
</head>
<body>

   <header>
      <h1>Life Quest</h1>
   </header>

   <main>
      <div class="create-box">
         <h2>Create your account</h2>

         <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>
         </div>

         <div>
            <label for="password">Password</label>
            <p class="hint">Password must be at least 10 characters long</p>
            <input type="password" id="password" name="secret" minlength="10" placeholder="Choose a password" required>
         </div>

         <div>
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" minlength="10" placeholder="Repeat your password" required>
         </div>

         <button type="submit">Create Account</button>

         <div class="login-text">
            <p>Already have an account? <a href="login.html">Log in</a></p>
         </div>
      </div>
   </main>

   <footer>
      <p>© 2026 LifeQuest</p>
   </footer>

</body>
</html>
